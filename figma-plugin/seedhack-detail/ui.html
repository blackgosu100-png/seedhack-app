<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 16px; font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 0 0 10px; color: var(--figma-color-text-secondary, #666); }
  textarea { width: 100%; height: 200px; box-sizing: border-box; font: 11px/1.4 ui-monospace, Menlo, monospace; border: 1px solid var(--figma-color-border, #ccc); border-radius: 6px; padding: 8px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--figma-color-border, #ccc); background: var(--figma-color-bg-secondary, #f3f3f3); color: inherit; cursor: pointer; }
  button.primary { background: #16a34a; color: #fff; border-color: #16a34a; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 20px; white-space: pre-wrap; }
  #status.err { color: #dc2626; }
  ol { padding-left: 18px; margin: 0 0 10px; color: var(--figma-color-text-secondary, #666); }
</style>
</head>
<body>
<h1>씨드핵 상세페이지 채우기</h1>
<p>앱이 만든 <b>out/figma-bundle.json</b>(이미지 포함 묶음)을 붙여 넣거나 파일로 고르세요.</p>
<ol>
  <li>템플릿 페이지에 <code>#hero.image</code> 같은 이름의 레이어가 있으면 그 자리에 채웁니다.</li>
  <li>없으면 780px 폭 프레임을 새로 만들어 줍니다.</li>
</ol>
<div class="row"><input type="file" id="file" accept=".json,application/json"></div>
<textarea id="json" placeholder='{"manifest": {...}, "images": {...}} 를 붙여 넣으세요'></textarea>
<div class="row">
  <button class="primary" id="apply">채우기</button>
  <button id="clear">비우기</button>
  <span id="size"></span>
</div>
<div id="status"></div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var status = function (m, err) { $("status").textContent = m; $("status").className = err ? "err" : ""; };
  $("file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { $("json").value = r.result; $("size").textContent = Math.round(r.result.length / 1024) + " KB"; }; r.readAsText(f);
  });
  $("clear").addEventListener("click", function () { $("json").value = ""; $("size").textContent = ""; status(""); });
  // base64 → Uint8Array (플러그인 본체에는 atob 가 없을 수 있어 UI 쪽에서 푼다)
  function bytes(b64) { var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  $("apply").addEventListener("click", function () {
    var text = $("json").value.trim();
    if (!text) return status("먼저 figma-bundle.json 을 넣어 주세요.", true);
    var data; try { data = JSON.parse(text); } catch (e) { return status("JSON 이 아닙니다: " + e.message, true); }
    var manifest = data.manifest || data; // manifest 만 붙여 넣어도 글은 채워진다(이미지는 없음)
    var images = {};
    Object.keys(data.images || {}).forEach(function (p) {
      var im = data.images[p]; if (!im) return;
      try { images[p] = bytes(typeof im === "string" ? im : im.base64 || ""); images[p + "__meta"] = { w: im.w || 0, h: im.h || 0 }; } catch (e) {}
    });
    $("apply").disabled = true; status("채우는 중…");
    parent.postMessage({ pluginMessage: { type: "apply", manifest: manifest, images: images } }, "*");
  });
  window.onmessage = function (e) {
    var m = e.data && e.data.pluginMessage; if (!m) return;
    $("apply").disabled = false;
    if (m.type === "done") { var r = m.result; status("완료 — 이미지 " + r.images + "장, 글 " + r.texts + "개" + (r.created ? " · 새 프레임을 만들었습니다" : " · 템플릿 레이어에 채웠습니다") + (r.missing.length ? "\n못 찾은 레이어: " + r.missing.join(", ") : "")); }
    else if (m.type === "error") status("오류: " + m.message, true);
  };
</script>
</body>
</html>
