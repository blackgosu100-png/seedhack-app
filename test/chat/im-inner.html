<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;font:14px sans-serif">
<div id="list" style="height:420px;overflow-y:auto;border-bottom:1px solid #ccc"><div>今天 14:00</div><div>以上是历史消息</div></div>
<div id="card" style="margin:4px 8px;border:1px solid #ddd;padding:6px">收纳盒 价格:16.4 <span id="lk" style="border:1px solid #36f;padding:2px 6px">发送链接</span></div>
<div id="ed" contenteditable="true" style="height:110px;margin:8px;border:1px solid #999"></div>
<button id="send" style="position:absolute;right:16px;bottom:16px">发送</button>
<script>
const R=[["亲，您好，欢迎光临本店，请问有什么可以帮您","有现货的，一箱100个"],["单个包装 10*8*5cm 重量120g，图片稍后发您"],["可以用空白箱"]];let n=0;window.trust=[];
const add=(t,me)=>{const d=document.createElement("div");d.style.textAlign=me?"right":"left";d.textContent=t;list.appendChild(d);list.scrollTop=1e9;};
send.onclick=(e)=>{trust.push(e.isTrusted);const t=ed.innerText.trim();if(!t)return;add(t,1);ed.innerText="";const rs=R[n++]||[];rs.forEach((r,i)=>setTimeout(()=>add(r,0),800+i*400));};
lk.onclick=(e)=>{trust.push("link:"+e.isTrusted);add("[商品] 收纳盒 ¥16.4",1);card.remove();};
for(let i=0;i<15;i++)add("旧消息 "+i,0);
</script></body></html>
